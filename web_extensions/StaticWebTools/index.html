<!DOCTYPE html>

        .tool-card a:hover { color: #3b82f6; }
        .tool-card .icon { font-size: 32px; margin-bottom: 8px; }
        .note { margin-top: 30px; color: #64748b; font-size: 14px; border-top: 1px solid #e2e8f0; padding-top: 15px; }
    </style>
</head>
