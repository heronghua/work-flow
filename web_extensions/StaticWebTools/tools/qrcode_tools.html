<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成与解析工具</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
            background: #f5f7fa;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 1.5rem;
        }
        h2 {
            margin-top: 0;
            font-weight: 500;
            color: #1e293b;
        }
        .field-group {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
        }
        input[type="text"] {
            flex: 1;
            padding: 0.6rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            min-width: 180px;
        }
        input[type="file"] {
            flex: 1;
            padding: 0.5rem 0;
            font-size: 0.9rem;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
        }
        button:hover {
            background: #1d4ed8;
        }
        button.secondary {
            background: #64748b;
        }
        button.secondary:hover {
            background: #475569;
        }
        .result-area {
            margin-top: 1.2rem;
            padding: 1rem;
            background: #f8fafc;
            border-radius: 12px;
            text-align: center;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #qrcodeCanvas {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            max-width: 100%;
        }
        .parse-result {
            font-size: 0.95rem;
            color: #0f172a;
            word-break: break-all;
            background: #eef2ff;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            width: 100%;
            text-align: left;
        }
        .error-msg {
            color: #b91c1c;
            background: #fee2e2;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            width: 100%;
        }
        hr {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 1.5rem 0;
        }
        .flex-center {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .note {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <!-- ===== 生成二维码区块 ===== -->
    <div class="card">
        <h2>📱 生成二维码</h2>
        <div class="field-group">
            <input type="text" id="textInput" placeholder="输入文本或 URL，例如：https://example.com" value="https://www.example.com">
            <button id="genQrCode">生成</button>
        </div>
        <div class="result-area" id="generateResult">
            <canvas id="qrcodeCanvas" width="200" height="200"></canvas>
            <div class="note">← 生成的二维码将显示在这里</div>
        </div>
    </div>

    <!-- ===== 解析二维码区块 ===== -->
    <div class="card">
        <h2>📷 解析二维码</h2>
        <div class="field-group">
            <input type="file" id="fileInput" accept="image/*">
            <button id="parseBtn" class="secondary">解析</button>
        </div>
        <div class="result-area" id="parseResult">
            <div style="color: #94a3b8;">等待选择并解析图片...</div>
        </div>
    </div>

    <!-- ===== 引入第三方库 ===== -->
    <script type="text/javascript" src="logger.js"></script>
    <!-- 生成二维码：qrcode (https://www.npmjs.com/package/qrcode) -->
    <script src="qrcode.min.js"></script>
    <!-- 解析二维码：jsQR (https://github.com/cozmo/jsQR) -->
    <script src="jsQR.js"></script>
	<script src="qrcode_tools.js"></script>
    </body>
</html>
