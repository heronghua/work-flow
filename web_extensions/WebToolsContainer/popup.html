<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 400px;
            padding: 0;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .header {
            background: #4a6fa5;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .container {
            padding: 15px;
        }
        .tool-item {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .tool-item:hover {
            background: #f5f5f5;
        }
        .tool-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tool-name {
            font-weight: bold;
        }
        .tool-category {
            background: #e0e0e0;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8em;
        }
        .tool-actions {
            margin-top: 5px;
            display: flex;
            gap: 5px;
        }
        .btn {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8em;
        }
        .btn-primary {
            background: #4a6fa5;
            color: white;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .search-box {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        .empty-state {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h3>HTML工具管理器</h3>
    </div>
    <div class="container">
        <input type="text" class="search-box" placeholder="搜索工具...">
        <div id="tools-list">
            <!-- 工具列表将通过JavaScript动态生成 -->
        </div>
        <button id="add-tool-btn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">添加新工具</button>
    </div>
    <script src="popup.js"></script>
</body>
</html>
